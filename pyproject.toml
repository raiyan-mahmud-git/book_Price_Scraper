[build-system]
requires = ["setuptools==75.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "book-price-tracker"
version = "1.0.0"
description = "A polite Books to Scrape price history tracker"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
book-scraper = "book_scraper.cli:main"

[tool.setuptools]
packages = ["book_scraper"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.optional-dependencies]
dev = ["pytest==8.3.3", "responses==0.25.3", "ruff==0.7.1", "mypy==1.13.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.mypy]
ignore_missing_imports = true

